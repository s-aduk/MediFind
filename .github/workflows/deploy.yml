name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: eu-north-1
  # These will be set via repository secrets
  # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install backend dependencies
        run: |
          npm ci
          # Install Python dependencies if needed for testing
          # pip install -r requirements.txt  # if we had one
      
      - name: Run backend tests
        run: |
          npm test
        env:
          # Mock environment variables for testing
          INVENTORY_TABLE: test-inventory-table
          PHARMACIES_TABLE: test-pharmacies-table
          USERS_TABLE: test-users-table
          ORDERS_TABLE: test-orders-table
      
      - name: Setup frontend
        working-directory: frontend
        run: |
          npm ci
      
      - name: Run frontend linting
        working-directory: frontend
        run: |
          npm run lint
      
      - name: Run frontend build check
        working-directory: frontend
        run: |
          npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Run dependency check (Node.js)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'medifind-backend'
          path: 'backend'
          format: 'HTML'
          failBuildOnCVSS: 7
      
      - name: Run npm audit
        working-directory: backend
        run: |
          npm audit --audit-level=high
      
      - name: Run npm audit (frontend)
        working-directory: frontend
        run: |
          npm audit --audit-level=high

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3
      
      - name: Build and validate SAM application
        working-directory: infrastructure
        run: |
          sam validate
          sam build

      - name: Upload SAM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sam-build
          path: infrastructure/.aws-sam
      
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Download SAM build artifact
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: infrastructure/.aws-sam
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: eu-north-1
      
      - name: Deploy to Staging
        working-directory: infrastructure
        run: |
          sam deploy \
            --stack-name medifind-staging \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides EnvironmentName=staging \
            --resolve-s3 \
            --no-confirm-changeset \
            --region eu-north-1 \
            --no-fail-on-empty-changeset \
            --tags Environment=staging
      
      - name: Deploy Frontend to S3
        run: |
          # Download frontend build
          mkdir -p frontend-build
          # In a real scenario, you'd download the frontend artifact here
          # For now, we'll rebuild or assume it's available
          
          # Sync to S3 bucket
          aws s3 sync frontend/.next s3://medifind-frontend-staging-${{ github.account_id }} \
            --delete \
            --region eu-north-1
            
          # Optional: Invalidate CloudFront cache
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_STAGING }} --paths "/*"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Download SAM build artifact
        uses: actions/download-artifact@v4
        with:
          name: sam-build
          path: infrastructure/.aws-sam
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: eu-north-1
      
      - name: Deploy to Production
        working-directory: infrastructure
        run: |
          sam deploy \
            --stack-name medifind-prod \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides EnvironmentName=prod \
            --resolve-s3 \
            --no-confirm-changeset \
            --region eu-north-1 \
            --no-fail-on-empty-changeset \
            --tags Environment=prod
      
      - name: Deploy Frontend to S3
        run: |
          # Sync to S3 bucket
          aws s3 sync frontend/.next s3://medifind-frontend-production-${{ github.account_id }} \
            --delete \
            --region eu-north-1
            
          # Optional: Invalidate CloudFront cache
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_PRODUCTION }} --paths "/*"

  # Optional: Manual workflow for database seeding
  seed-database:
    name: Seed Database
    runs-on: ubuntu-latest
    inputs:
      environment:
        description: 'Target environment (staging/production)'
        required: true
        default: 'staging'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: eu-north-1
        # Note: In a real workflow, you'd select credentials based on environment input
      
      - name: Install dependencies
        run: |
          cd backend
          pip install boto3
      
      - name: Run seed script
        run: |
          cd backend
          python seed_data.py
        env:
          # Override table names if needed for different environments
          # These would normally come from the deployed stack outputs
          AWS_DEFAULT_REGION: eu-north-1